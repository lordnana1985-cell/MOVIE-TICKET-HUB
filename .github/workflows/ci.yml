name: CI

on:
  push:
    branches:
      - main
      - master
      - '**'
  pull_request:
    branches:
      - main
      - master

jobs:
  build-lint-test:
    name: Build, Lint, Test & Coverage
    runs-on: ubuntu-latest

    env:
      CI: 'true'
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://placeholder-project.supabase.co' }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'placeholder-anon-key' }}
      PAYSTACK_SECRET_KEY: ${{ secrets.PAYSTACK_SECRET_KEY || 'sk_test_placeholder' }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || 'placeholder_gemini_key' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --include=dev || npm install --include=dev --legacy-peer-deps

      - name: Security & Dependency Audit
        run: npm audit --audit-level=high

      - name: TypeScript Typecheck
        run: npm run lint

      - name: Test Suite with Coverage Enforced
        env:
          NODE_ENV: test
        run: npm run test:coverage

      - name: Production Build
        env:
          NODE_ENV: production
        run: npm run build
