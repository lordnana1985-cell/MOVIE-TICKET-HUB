name: CI

on:
  push:
    branches:
      - main
      - master
      - '**'
  pull_request:
    branches:
      - main
      - master

jobs:
  validate:
    name: Validate, Lint, Test & Build
    runs-on: ubuntu-latest

    env:
      CI: 'true'
      NODE_ENV: test
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://placeholder-project.supabase.co' }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'placeholder-anon-key' }}
      PAYSTACK_SECRET_KEY: ${{ secrets.PAYSTACK_SECRET_KEY || 'sk_test_placeholder' }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || 'placeholder_gemini_key' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --include=dev || npm install --include=dev --legacy-peer-deps

      - name: Security & Dependency Audit
        run: npm audit --audit-level=high

      - name: Dependency Freshness Check (Informational)
        continue-on-error: true
        run: npm outdated || true

      - name: Code Formatting Check (Prettier)
        run: npm run format:check

      - name: TypeScript Typecheck
        run: npm run lint

      - name: Static Code Analysis (ESLint)
        run: npm run lint:eslint

      - name: Test Suite & Coverage Verification (Vitest)
        env:
          NODE_ENV: test
          VITEST: 'true'
        run: npm run test:coverage

      - name: Production Build & Asset Verification
        env:
          NODE_ENV: production
        run: npm run build

  dependency-freshness:
    name: Dependency Freshness Audit (Informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --include=dev || npm install --include=dev --legacy-peer-deps

      - name: Surface Outdated Dependencies
        run: npm outdated || true
